name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:  # persistence tests run against a real PostgreSQL (test-only credentials)
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aq
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AQ_TEST_DATABASE_URL: postgresql+psycopg://aq:ci-only-not-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Type check
        run: .venv/bin/mypy
      - name: Caddy (deployment smoke test)
        run: |
          curl -sSfL -o /tmp/caddy.tgz https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz
          echo "5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd  /tmp/caddy.tgz" | sha256sum -c -
          tar -xzf /tmp/caddy.tgz -C /tmp caddy
          echo "AQ_TEST_CADDY=/tmp/caddy" >> "$GITHUB_ENV"
      - name: Tests
        run: .venv/bin/pytest --cov --cov-report=term-missing
      - name: Validate shipped configuration
        run: for env in development paper production; do .venv/bin/aq --env $env config validate; done

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: API types match the committed OpenAPI schema
        run: npm run check:api
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (static export)
        run: npm run build
      - name: End-to-end tests (mocked API)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  images:
    # The deployment images build from the repository root exactly as Railway builds them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app image (api + worker)
        run: docker build -f deploy/docker/app.Dockerfile -t aq-app:ci .
      - name: Build dashboard image
        run: docker build -f deploy/docker/dashboard.Dockerfile -t aq-dashboard:ci .
      - name: Start-up checks refuse unsafe configurations
        run: |
          set +e
          docker run --rm -e AQ_ROLE=api -e DATABASE_URL=postgresql://x@db/x \
            -e AQ_API_TOKEN=$(openssl rand -hex 32) -e AQ_LIVE_TRADING_CONFIRM=yes aq-app:ci
          test $? -eq 2 || { echo "live confirmation was not refused"; exit 1; }
          docker run --rm aq-app:ci
          test $? -eq 64 || { echo "missing role was not refused"; exit 1; }
