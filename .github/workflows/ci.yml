name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:  # persistence tests run against a real PostgreSQL (test-only credentials)
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aq
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AQ_TEST_DATABASE_URL: postgresql+psycopg://aq:ci-only-not-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Type check
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/pytest --cov --cov-report=term-missing
      - name: Validate shipped configuration
        run: for env in development paper production; do .venv/bin/aq --env $env config validate; done

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: API types match the committed OpenAPI schema
        run: npm run check:api
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (static export)
        run: npm run build
      - name: End-to-end tests (mocked API)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
