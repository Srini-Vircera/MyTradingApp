[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "adaptive-quant"
version = "0.1.0"
description = "Systematic, risk-first quantitative trading platform (paper trading by default)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "tzdata>=2024.1",
    "numpy>=2.0",
    "pandas>=3.0",  # copy-on-write by default: shared history cannot be mutated
    "pyarrow>=16.0",
    "httpx>=0.27",
    "exchange-calendars>=4.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pandas-stubs>=3.0",
]

[project.scripts]
aq = "adaptive_quant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_quant"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that exercise several components together",
    "regression: golden-number tests that guard financial calculations",
    "postgres: tests that need a real PostgreSQL server (temporary cluster or AQ_TEST_DATABASE_URL)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # naming
    "S",             # bandit (security)
    "BLE",           # blind except
    "DTZ",           # naive datetimes are forbidden
    "RUF",
    "SIM",
    "PT",
]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "N818",  # exception names like SafetyViolation read better without an Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S608", "PT018"]
# HTML/SVG/CSS/JS templates: wrapping markup strings hurts readability
"src/adaptive_quant/quant/analytics/charts.py" = ["E501"]
"src/adaptive_quant/quant/analytics/report.py" = ["E501"]
"src/adaptive_quant/quant/research/report.py" = ["E501"]
"src/adaptive_quant/notifications/templates.py" = ["E501"]
# generated migrations and SQL trigger bodies
"src/adaptive_quant/persistence/migrations/**" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*", "pyarrow", "pyarrow.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["adaptive_quant"]
branch = true
